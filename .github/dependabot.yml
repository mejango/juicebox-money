version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-patch-days: 7
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # This is an npm alias supplied by @wagmi/connectors, not a registry name.
    ignore:
      - dependency-name: cbw-sdk
      # Pinned on purpose: scripts/audit-production.mjs audits this exact
      # version's elliptic usage. Bump PARA_VERSION there when upgrading.
      - dependency-name: '@getpara/*'
    groups:
      framework:
        applies-to: version-updates
        patterns: [next, eslint-config-next]
        update-types: [minor, patch]
      authentication:
        applies-to: version-updates
        patterns: ['@getpara/*']
        update-types: [minor, patch]
      wallets:
        applies-to: version-updates
        patterns:
          - '@base-org/account'
          - '@coinbase/wallet-sdk'
          - '@safe-global/*'
          - '@wagmi/*'
          - '@walletconnect/*'
          - viem
          - wagmi
        update-types: [minor, patch]
      browser-tests:
        applies-to: version-updates
        patterns:
          - '@axe-core/playwright'
          - '@playwright/test'
          - playwright
          - playwright-core
        update-types: [minor, patch]
      typescript:
        applies-to: version-updates
        patterns:
          - '@typescript/*'
          - '@typescript-eslint/*'
          - typescript
          - typescript-eslint
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: [dependencies]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: [dependencies, container]
    commit-message:
      prefix: container
