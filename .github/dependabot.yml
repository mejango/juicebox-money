version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      safe-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Sao_Paulo
    groups:
      safe-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Sao_Paulo
    groups:
      safe-non-major:
        patterns: ['*']
        update-types: [minor, patch]
    labels: [dependencies, container]
    commit-message:
      prefix: container
