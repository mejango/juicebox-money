name: Release OCI image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --no-experimental-webstorage
  IMAGE: ghcr.io/bananapus/juicebox-money
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_BENDYSTRAW_URL: ${{ vars.NEXT_PUBLIC_BENDYSTRAW_URL }}
  NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL: ${{ vars.NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL }}
  NEXT_PUBLIC_PARA_API_KEY: ${{ vars.NEXT_PUBLIC_PARA_API_KEY }}
  NEXT_PUBLIC_PARA_ENV: ${{ vars.NEXT_PUBLIC_PARA_ENV }}
  NEXT_PUBLIC_DWELLIR_API_KEY: ${{ vars.NEXT_PUBLIC_DWELLIR_API_KEY }}
  NEXT_PUBLIC_VERSION: ${{ github.sha }}
  IPFS_PINNING_ENABLED: 'false'

jobs:
  verify-build-and-smoke:
    name: Verify and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned deployment artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Bananapus/deploy-all-v6
          ref: 316e9d4d3f9e1c5b41a5df7c0ad6183abbeccc7f
          path: .contract-source/deploy-all-v6
          sparse-checkout: deployments
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@12.0.1 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify the locked production dependency graph
        run: npm run deps:check
      - name: Validate release configuration
        run: npm run env:check:all
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the complete release gate
        env:
          PROTOCOL_DEPLOYMENTS_DIR: ${{ github.workspace }}/.contract-source/deploy-all-v6
        run: npm run check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build locally for runtime smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: juicebox-money:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BENDYSTRAW_URL=${{ env.NEXT_PUBLIC_BENDYSTRAW_URL }}
            NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL=${{ env.NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL }}
            NEXT_PUBLIC_PARA_API_KEY=${{ env.NEXT_PUBLIC_PARA_API_KEY }}
            NEXT_PUBLIC_PARA_ENV=${{ env.NEXT_PUBLIC_PARA_ENV }}
            NEXT_PUBLIC_DWELLIR_API_KEY=${{ env.NEXT_PUBLIC_DWELLIR_API_KEY }}
            NEXT_PUBLIC_VERSION=${{ github.sha }}
      - name: Smoke-test the standalone image
        run: |
          docker run --detach --name juicebox-release-smoke \
            --read-only \
            --tmpfs /app/.next/cache:uid=1000,gid=1000 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:3000:3000 \
            --env IPFS_PINNING_ENABLED=false \
            juicebox-money:release-candidate
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/healthz >/dev/null; then
              test "$(docker inspect --format '{{.Config.User}}' juicebox-release-smoke)" = node
              exit 0
            fi
            sleep 1
          done
          docker logs juicebox-release-smoke
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force juicebox-release-smoke || true

  publish:
    name: Publish immutable image
    needs: verify-build-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out verified repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU for the final multi-architecture image
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable image with attestations
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BENDYSTRAW_URL=${{ env.NEXT_PUBLIC_BENDYSTRAW_URL }}
            NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL=${{ env.NEXT_PUBLIC_TESTNET_BENDYSTRAW_URL }}
            NEXT_PUBLIC_PARA_API_KEY=${{ env.NEXT_PUBLIC_PARA_API_KEY }}
            NEXT_PUBLIC_PARA_ENV=${{ env.NEXT_PUBLIC_PARA_ENV }}
            NEXT_PUBLIC_DWELLIR_API_KEY=${{ env.NEXT_PUBLIC_DWELLIR_API_KEY }}
            NEXT_PUBLIC_VERSION=${{ github.sha }}
      - name: Record immutable release reference
        run: |
          echo "Image: $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
